services:
  - type: web
    name: worldtycoon
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUMISTA_CHAIN_MODE
        value: live
      - key: NUMISTA_NETWORK
        value: mainnet
      - key: NUMISTA_DAEMON_RPC
        sync: false
      - key: NUMISTA_WALLET_RPC
        sync: false
      - key: NUMISTA_RPC_USER
        sync: false
      - key: NUMISTA_RPC_PASS
        sync: false
      - key: NUMISTA_ISSUER_WALLET
        sync: false
      - key: NUMISTA_ISSUER_WALLET_PASSWORD
        sync: false
      - key: NUMISTA_ISSUER_PUBLIC_KEY
        sync: false
      - key: NUMISTA_TREASURY_USER
        sync: false
      - key: NUMISTA_TREASURY_ADDRESS
        sync: false
      - key: NUMISTA_CURRENCY_ASSET_ID
        sync: false
      - key: NUMISTA_ADMINS
        value: danie,d4kkkkkkkkkkkkkkkkkk