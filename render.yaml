services:
  - type: web
    name: goldnumista
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUMISTA_CHAIN_MODE
        value: live
      - key: NUMISTA_DAEMON_RPC
        sync: false
      - key: NUMISTA_WALLET_RPC
        sync: false
      - key: NUMISTA_RPC_USER
        sync: false
      - key: NUMISTA_RPC_PASS
        sync: false
      - key: NUMISTA_ISSUER_WALLET
        value: goldnumista
      - key: NUMISTA_ISSUER_WALLET_PASSWORD
        sync: false
      - key: NUMISTA_ISSUER_PUBLIC_KEY
        value: c98dc334ccfb8ecfc6f40557823b7702dbe3caaa1202d50eb84424925748e30d
      - key: NUMISTA_TREASURY_USER
        value: crown_treasury
      - key: NUMISTA_ADMINS
        value: danie,d4kkkkkkkkkkkkkkkkkk